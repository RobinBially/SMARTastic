name: Build and test
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.3'
      - run: python3 -m unittest discover -s Tests/Release -v
      - run: swift test
      - name: Build and verify Universal app
        env:
          ARCHS: arm64 x86_64
        run: ./scripts/make-app.sh
      - name: Check bundled resources and version
        run: |
          test -d .build/app/SMARTastic.app/Contents/Resources/SMARTastic_SMARTastic.bundle
          lipo -verify_arch arm64 x86_64 .build/app/SMARTastic.app/Contents/MacOS/SMARTastic
          codesign --verify --deep --strict .build/app/SMARTastic.app
